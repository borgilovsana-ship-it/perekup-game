<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hypergamy</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="empty-screen" aria-label="Игра">
    <img class="hands-image" src="file_00000000001ec81f49b61997a4872070e.png" alt="Две настоящие руки для хлопка" />
    <button class="clap-button" id="clapButton" type="button">Хлопнуть</button>
  </main>
  <script>
    const button = document.getElementById('clapButton');
    const hands = document.querySelector('.hands-image');
    button.addEventListener('click', () => {
      hands.classList.remove('clapping');
      void hands.offsetWidth;
      hands.classList.add('clapping');
    });
  </script>
</body>
</html>
