<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hypergamy</title><link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<main class="empty-screen" aria-label="Hypergamy">
  <div class="stage">
    <div class="sticker hand-left" role="img" aria-label="Рука слева">🫸</div>
    <div class="sticker hand-right" role="img" aria-label="Рука справа">🫷</div>
    <div class="spark spark-one">✦</div><div class="spark spark-two">✧</div>
  </div>
  <button class="clap-button" id="clapButton">Хлопнуть</button>
  <div class="hint">НАЖМИ, ЧТОБЫ ХЛОПНУТЬ</div>
</main>
<script>
const stage=document.querySelector('.stage'),button=document.querySelector('#clapButton');
button.addEventListener('click',()=>{if(stage.classList.contains('clapping'))return;stage.classList.add('clapping');button.textContent='ХЛОПОК!';setTimeout(()=>{stage.classList.remove('clapping');button.textContent='Хлопнуть'},500)});
</script>
</body></html>
