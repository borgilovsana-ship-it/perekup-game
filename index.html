<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hypergamy</title><link rel="stylesheet" href="style.css">
</head>
<body>
<main class="empty-screen" aria-label="Hypergamy">
  <div class="stage">
    <svg class="sticker hand-left" viewBox="0 0 260 320" role="img" aria-label="Ладонь">
      <defs>
        <linearGradient id="palmL" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#ffd7a7"/><stop offset=".48" stop-color="#ffad72"/><stop offset="1" stop-color="#f07852"/></linearGradient>
        <linearGradient id="fingerL" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe2b8"/><stop offset="1" stop-color="#f58a60"/></linearGradient>
      </defs>
      <path class="outline" d="M73 298 Q60 286 57 262 L47 202 Q43 183 29 162 L12 136 Q4 122 16 112 Q28 103 39 119 L64 151 L63 53 Q63 33 80 32 Q98 32 98 53 L99 119 L105 24 Q106 5 124 5 Q143 5 143 25 L140 119 L153 40 Q155 21 173 24 Q191 27 187 46 L173 125 L195 69 Q203 52 218 60 Q232 68 224 86 L194 159 Q184 186 177 213 L173 298Z"/>
      <path class="skin" d="M73 298 Q60 286 57 262 L47 202 Q43 183 29 162 L12 136 Q4 122 16 112 Q28 103 39 119 L64 151 L63 53 Q63 33 80 32 Q98 32 98 53 L99 119 L105 24 Q106 5 124 5 Q143 5 143 25 L140 119 L153 40 Q155 21 173 24 Q191 27 187 46 L173 125 L195 69 Q203 52 218 60 Q232 68 224 86 L194 159 Q184 186 177 213 L173 298Z"/>
      <path class="shine" d="M75 54 L77 142 M116 26 L115 118 M165 43 L158 112 M209 72 L190 122"/>
      <path class="crease" d="M76 190 Q112 209 158 187 M81 224 Q116 240 154 222 M88 255 Q112 264 137 254"/>
      <path class="nail" d="M70 48 Q70 36 80 36 Q91 36 91 49 L91 68 L70 68Z M112 22 Q113 10 124 10 Q135 10 136 23 L135 43 L112 43Z M161 39 Q163 28 173 29 Q184 31 181 43 L177 61 L157 57Z M204 70 Q208 60 217 65 Q225 70 220 81 L213 94 L197 86Z"/>
      <path class="cuff" d="M72 277 Q121 292 175 276 L173 306 L75 306Z"/>
    </svg>
    <svg class="sticker hand-right" viewBox="0 0 260 320" role="img" aria-label="Ладонь">
      <defs>
        <linearGradient id="palmR" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#ffd7a7"/><stop offset=".48" stop-color="#ffad72"/><stop offset="1" stop-color="#f07852"/></linearGradient>
        <linearGradient id="fingerR" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe2b8"/><stop offset="1" stop-color="#f58a60"/></linearGradient>
      </defs>
      <g transform="translate(260 0) scale(-1 1)">
      <path class="outline" d="M73 298 Q60 286 57 262 L47 202 Q43 183 29 162 L12 136 Q4 122 16 112 Q28 103 39 119 L64 151 L63 53 Q63 33 80 32 Q98 32 98 53 L99 119 L105 24 Q106 5 124 5 Q143 5 143 25 L140 119 L153 40 Q155 21 173 24 Q191 27 187 46 L173 125 L195 69 Q203 52 218 60 Q232 68 224 86 L194 159 Q184 186 177 213 L173 298Z"/>
      <path class="skin" d="M73 298 Q60 286 57 262 L47 202 Q43 183 29 162 L12 136 Q4 122 16 112 Q28 103 39 119 L64 151 L63 53 Q63 33 80 32 Q98 32 98 53 L99 119 L105 24 Q106 5 124 5 Q143 5 143 25 L140 119 L153 40 Q155 21 173 24 Q191 27 187 46 L173 125 L195 69 Q203 52 218 60 Q232 68 224 86 L194 159 Q184 186 177 213 L173 298Z"/>
      <path class="shine" d="M75 54 L77 142 M116 26 L115 118 M165 43 L158 112 M209 72 L190 122"/>
      <path class="crease" d="M76 190 Q112 209 158 187 M81 224 Q116 240 154 222 M88 255 Q112 264 137 254"/>
      <path class="nail" d="M70 48 Q70 36 80 36 Q91 36 91 49 L91 68 L70 68Z M112 22 Q113 10 124 10 Q135 10 136 23 L135 43 L112 43Z M161 39 Q163 28 173 29 Q184 31 181 43 L177 61 L157 57Z M204 70 Q208 60 217 65 Q225 70 220 81 L213 94 L197 86Z"/>
      <path class="cuff" d="M72 277 Q121 292 175 276 L173 306 L75 306Z"/>
      </g>
    </svg>
    <div class="spark spark-one">✦</div><div class="spark spark-two">✧</div>
  </div>
  <button class="clap-button" id="clapButton">Хлопнуть</button>
  <div class="hint">НАЖМИ, ЧТОБЫ ХЛОПНУТЬ</div>
</main>
<script>
const stage=document.querySelector('.stage'),button=document.querySelector('#clapButton');
button.addEventListener('click',()=>{if(stage.classList.contains('clapping'))return;stage.classList.add('clapping');button.textContent='ХЛОПОК!';setTimeout(()=>{stage.classList.remove('clapping');button.textContent='Хлопнуть'},500)});
</script>
</body></html>
